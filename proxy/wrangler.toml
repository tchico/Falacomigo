# Cloudflare Worker for the speech proxy. See README.md.
name = "fala-comigo-speech"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

# No request logging of bodies: keep observability off so children's audio is never recorded (NFR-05).
[observability]
enabled = false

# Daily cap (NFR-06). Create with: npx wrangler@4 kv namespace create USAGE, then paste the id here.
# [[kv_namespaces]]
# binding = "USAGE"
# id = "<your namespace id>"

[vars]
AZURE_SPEECH_REGION = "westeurope"
DAILY_LIMIT = "400"
