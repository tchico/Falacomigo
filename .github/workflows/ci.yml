name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Generated files are up to date
        working-directory: .
        run: |
          node tools/build-guide.mjs --check
          node tools/build-issues.mjs --check
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (engine + content packs)
        run: npm test
      - name: App bundles for Android
        run: npx expo export --platform android --output-dir /tmp/export
        env:
          EXPO_OFFLINE: '1'
